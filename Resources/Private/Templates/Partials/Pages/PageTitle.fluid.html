<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection" data-namespace-typo3-fluid="true">

<f:comment>
    The page-level h1. Every content element heads its own band with an h2, so
    this is the single h1 on a content page and it always says what the page
    is — the title in the page tree, the title in the tab, the title on screen.
</f:comment>

<a:layout.container class="astryx-page-header">
    <h1 class="astryx-page-title">{page.pageRecord.title}</h1>
</a:layout.container>

</html>
