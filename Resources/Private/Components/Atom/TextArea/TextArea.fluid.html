<f:comment>
    TextArea — several lines of text, as the bare `<textarea>` the stylesheet
    is written against.

    The bare control, like TextInput and for the same reason: TYPO3 emits one
    element, the shell recipe covers both anatomies, and a wrapper here would
    only add a box for the sake of matching upstream's React tree.

    The value is element content, not an attribute — a textarea has no `value`
    — so the opening and closing tags sit against `{value}` with nothing
    between them. A single newline after `<textarea>` is swallowed by the
    parser, but the second one is not, and every save would then add a blank
    line to the top of the field.

    There is no character counter. A counter is a number that changes while you
    type, and a server-rendered one is right for exactly as long as the visitor
    does nothing. `maxlength` is emitted instead and the browser enforces it. A
    live count needs script, and this extension has none — so the counter's
    rules are out of the stylesheet too, rather than waiting there for markup
    that cannot honestly be written.

    `status="error"` also renders aria-invalid, because a red border is a
    colour and a colour is not a message.
</f:comment>

<f:argument name="name" type="string" optional="{true}" default="" />
<f:argument name="value" type="string" optional="{true}" default="" />
<f:argument name="placeholder" type="string" optional="{true}" default="" />
<f:argument name="rows" type="string" optional="{true}" default="" />
<f:argument name="size" type="string" optional="{true}" default="md" />
<f:argument name="status" type="string" optional="{true}" default="default" />
<f:argument name="disabled" type="boolean" optional="{true}" default="{false}" />
<f:argument name="required" type="boolean" optional="{true}" default="{false}" />
<f:argument name="readonly" type="boolean" optional="{true}" default="{false}" />
<f:argument name="maxlength" type="string" optional="{true}" default="" />
<f:argument name="describedBy" type="string" optional="{true}" default="" />
<f:argument name="ariaLabel" type="string" optional="{true}" default="" />
<f:argument name="autocomplete" type="string" optional="{true}" default="" />
<f:argument name="id" type="string" optional="{true}" default="" />
<f:argument name="class" type="string" optional="{true}" default="" />

<textarea
    id="{id}"
    class="astryx-text-area {class}"
    name="{name}"
    placeholder="{placeholder}"
    rows="{rows}"
    maxlength="{maxlength}"
    autocomplete="{autocomplete}"
    data-size="{size}"
    data-status="{status}"
    data-disabled="{f:if(condition: disabled, then: 'disabled', else: 'false')}"
    aria-invalid="{f:if(condition: '{status} == \'error\'', then: 'true', else: 'false')}"
    aria-describedby="{describedBy}"
    aria-label="{ariaLabel}"
    {f:if(condition: disabled, then: 'disabled')}
    {f:if(condition: required, then: 'required')}
    {f:if(condition: readonly, then: 'readonly')}>{value}</textarea>
