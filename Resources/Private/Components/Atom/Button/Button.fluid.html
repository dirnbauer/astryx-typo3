<f:comment>
    Button — an action, as a <button> or, when it navigates, as a link.

    A link that looks like a button is still a link: it must be an <a> so that
    middle-click, "open in new tab" and the screen reader's link list all behave.
    Which element is rendered is therefore not a free choice — it follows from
    what the caller gives the component:

      parameter   a TYPO3 link field ("13 _blank - title", a mail address, an
                  external URL). Resolved with f:link.typolink. By far the
                  commonest case: 199 call sites in the catalog used to wrap a
                  button in a link ViewHelper and hand it the classes by hand.
      href        a plain URL already resolved by the template.
      neither     a real <button>, for something that submits or toggles.

    `data-variant` and `data-size` are upstream's own attribute names since
    Astryx v0.6.0, where `.astryx-button.primary` became
    `.astryx-button[data-variant="primary"]`.
</f:comment>

<f:argument name="variant" type="string" optional="{true}" default="primary" />
<f:argument name="size" type="string" optional="{true}" default="md" />
<f:argument name="width" type="string" optional="{true}" default="auto" />
<f:argument name="parameter" type="string" optional="{true}" default="" />
<f:argument name="href" type="string" optional="{true}" default="" />
<f:argument name="target" type="string" optional="{true}" default="" />
<f:argument name="type" type="string" optional="{true}" default="button" />
<f:argument name="disabled" type="boolean" optional="{true}" default="{false}" />
<f:argument name="class" type="string" optional="{true}" default="" />
<f:argument name="title" type="string" optional="{true}" default="" />
<f:argument name="ariaLabel" type="string" optional="{true}" default="" />

<f:variable name="mode">{f:if(condition: parameter, then: 'typolink', else: '{f:if(condition: href, then: \'link\', else: \'button\')}')}</f:variable>

<f:switch expression="{mode}">
    <f:case value="typolink"><f:link.typolink parameter="{parameter}" class="astryx-button {class}" data-variant="{variant}" data-size="{size}" data-width="{width}" title="{title}" aria-label="{ariaLabel}"><f:slot /></f:link.typolink></f:case>
    <f:comment>
        rel="noopener noreferrer" only where it means something: a target that
        opens a new browsing context.
    </f:comment>
    <f:case value="link"><a href="{href}" class="astryx-button {class}" data-variant="{variant}" data-size="{size}" data-width="{width}" target="{target}" rel="{f:if(condition: '{target} == \'_blank\'', then: 'noopener noreferrer')}" title="{title}" aria-label="{ariaLabel}"><f:slot /></a></f:case>
    <f:defaultCase>
        <f:if condition="{disabled}">
            <f:then><button type="{type}" class="astryx-button {class}" data-variant="{variant}" data-size="{size}" data-width="{width}" title="{title}" aria-label="{ariaLabel}" disabled="disabled"><f:slot /></button></f:then>
            <f:else><button type="{type}" class="astryx-button {class}" data-variant="{variant}" data-size="{size}" data-width="{width}" title="{title}" aria-label="{ariaLabel}"><f:slot /></button></f:else>
        </f:if>
    </f:defaultCase>
</f:switch>
