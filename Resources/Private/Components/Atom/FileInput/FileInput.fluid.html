<f:comment>
    FileInput — the dashed box you put a file in.

    A `<label>` around a real `<input type="file">`, so the whole box is the
    hit target the dashed border promises and `cursor: pointer` on it is true.
    The input is left visible rather than clipped: its button is the only part
    of a file control a browser lets anyone style, clipping it takes away the
    one affordance that says what will happen, and the box would then look like
    a drop zone in a page that cannot receive a drop.

    Which it cannot. `data-state="active"` in the stylesheet is the drag-over
    tint, and it needs a dragover listener to ever be set — there is no script
    here, so the attribute is never written and the box is a click target, not
    a drop target. Dropping a file on it does what dropping a file on any page
    does: the browser opens it. Saying so is better than drawing a dashed
    rectangle that quietly does nothing.

    `filename` is the file already stored on the record, not the one being
    chosen — the browser does not tell the page what was picked without script.
    It is the answer to "is something attached here already", which is the
    question an editor reopening a form actually has.

    Pass `ariaLabel` where the prompt inside the box is not a good name for the
    control: an aria-label on the input wins over the wrapping label's text, so
    "Drag a file here or choose one" can stay as the prompt while the control
    announces itself as "Attachment".
</f:comment>

<f:argument name="name" type="string" optional="{true}" default="" />
<f:argument name="accept" type="string" optional="{true}" default="" />
<f:argument name="filename" type="string" optional="{true}" default="" />
<f:argument name="density" type="string" optional="{true}" default="" />
<f:argument name="status" type="string" optional="{true}" default="default" />
<f:argument name="multiple" type="boolean" optional="{true}" default="{false}" />
<f:argument name="disabled" type="boolean" optional="{true}" default="{false}" />
<f:argument name="required" type="boolean" optional="{true}" default="{false}" />
<f:argument name="describedBy" type="string" optional="{true}" default="" />
<f:argument name="ariaLabel" type="string" optional="{true}" default="" />
<f:argument name="id" type="string" optional="{true}" default="" />
<f:argument name="class" type="string" optional="{true}" default="" />

<label
    class="astryx-file-input {class}"
    data-density="{density}"
    data-status="{status}"
    data-disabled="{f:if(condition: disabled, then: 'disabled', else: 'false')}"><f:slot /><input
        id="{id}"
        type="file"
        name="{name}"
        accept="{accept}"
        aria-describedby="{describedBy}"
        aria-label="{ariaLabel}"
        aria-invalid="{f:if(condition: '{status} == \'error\'', then: 'true', else: 'false')}"
        {f:if(condition: multiple, then: 'multiple')}
        {f:if(condition: disabled, then: 'disabled')}
        {f:if(condition: required, then: 'required')} /><f:if condition="{filename}"><span class="astryx-file-input-filename">{filename}</span></f:if></label>
