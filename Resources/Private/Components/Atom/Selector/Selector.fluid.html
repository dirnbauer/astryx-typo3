<f:comment>
    Selector — one choice out of a list, as the native `<select>`.

    This is the native anatomy of the two the stylesheet carries. The `<select>`
    itself is the root and the options arrive through the slot as real
    `<option>` elements, so the whole control — type-ahead on the first letters,
    the phone's wheel, the form payload, the screen reader announcing "3 of
    17" — is the platform's and needs nothing from us. The other anatomy, a
    button trigger over a `role="listbox"`, is SelectorOption's; it looks
    identical and needs script to work, which is why this is the default.

    The chevron is two gradients in currentColor, so it follows the theme
    without an image. That rule reaches the element by `select.astryx-selector`
    as well as through a Field, which is what lets a Selector standing on its
    own keep the drawn chevron instead of the platform one.

    `multiple` changes the control into a list box and is an HTML boolean, so
    it is the inline f:if form — emitted empty it would still mean multiple.
    The stylesheet drops the chevron and lets the box grow when it is set.
</f:comment>

<f:argument name="name" type="string" optional="{true}" default="" />
<f:argument name="size" type="string" optional="{true}" default="md" />
<f:argument name="status" type="string" optional="{true}" default="default" />
<f:argument name="disabled" type="boolean" optional="{true}" default="{false}" />
<f:argument name="required" type="boolean" optional="{true}" default="{false}" />
<f:argument name="multiple" type="boolean" optional="{true}" default="{false}" />
<f:argument name="autocomplete" type="string" optional="{true}" default="" />
<f:argument name="describedBy" type="string" optional="{true}" default="" />
<f:argument name="ariaLabel" type="string" optional="{true}" default="" />
<f:argument name="id" type="string" optional="{true}" default="" />
<f:argument name="class" type="string" optional="{true}" default="" />

<select
    id="{id}"
    class="astryx-selector {class}"
    name="{name}"
    autocomplete="{autocomplete}"
    data-size="{size}"
    data-status="{status}"
    data-disabled="{f:if(condition: disabled, then: 'disabled', else: 'false')}"
    aria-invalid="{f:if(condition: '{status} == \'error\'', then: 'true', else: 'false')}"
    aria-describedby="{describedBy}"
    aria-label="{ariaLabel}"
    {f:if(condition: disabled, then: 'disabled')}
    {f:if(condition: required, then: 'required')}
    {f:if(condition: multiple, then: 'multiple')}><f:slot /></select>
