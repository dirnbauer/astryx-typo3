<f:comment>Vertical Stack, sharing the existing spacing contract.</f:comment>
<f:argument name="gap" type="string" optional="{true}" default="default" />
<f:argument name="align" type="string" optional="{true}" default="default" />
<f:argument name="justify" type="string" optional="{true}" default="default" />
<f:argument name="as" type="string" optional="{true}" default="div" />
<f:argument name="class" type="string" optional="{true}" default="" />
<a:layout.stack orientation="vertical" gap="{gap}" align="{align}" justify="{justify}" as="{as}" class="astryx-v-stack {class}"><f:slot /></a:layout.stack>
