<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    EXT:solr's plugin for the results page. The theme's Solr templates open their own
    Astryx Section and Container, so this renders in the Bare layout: the
    anchor and nothing else, no second band around the first.
</f:comment>

<f:layout name="Bare"/>

<f:section name="Main">
    <f:cObject typoscriptObjectPath="plugin.tx_solr_PiResults_Results" data="{data}" table="tt_content"/>
</f:section>

</html>
