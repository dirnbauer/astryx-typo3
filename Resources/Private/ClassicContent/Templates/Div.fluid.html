<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    A divider is a thematic break and nothing else, so it is the Astryx Divider
    — an hr — on the tight band the layout gives this CType. A header on a
    divider element is not rendered, as in fluid_styled_content: the break has
    no subject.
</f:comment>

<f:layout name="Default"/>

<f:section name="Main">
    <a:atom.divider class="g-core-divider"/>
</f:section>

</html>
