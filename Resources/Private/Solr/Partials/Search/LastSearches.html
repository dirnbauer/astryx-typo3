<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
    xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:argument name="lastSearches" type="iterable" optional="true"/>

<f:section name="LastSearches">
    <f:comment>
        Declared inside the section, not above it: a template or partial that is
        rendered through a layout or by section name never evaluates its root
        content, so a variable set out there is simply absent by the time the
        section runs — and every key built from it silently loses its path.
    </f:comment>
    <f:variable name="labels" value="LLL:EXT:astryx_typo3/Resources/Private/Language/labels.xlf"/>

    <s:lastSearches>
        <f:if condition="{lastSearches}">
            <a:molecule.card variant="flat" class="g-search__facet" ariaLabelledby="tx-solr-lastsearches-label">
                <a:molecule.cardTitle class="g-search__facet-title" id="tx-solr-lastsearches-label">
                    <f:translate key="{labels}:search.lastSearches" default="Recent searches"/>
                </a:molecule.cardTitle>

                <a:molecule.list density="compact" class="g-search__facet-list" id="tx-solr-lastsearches">
                    <f:for each="{lastSearches}" as="searchedFor">
                        <li>
                            <a:molecule.item density="compact" interactive="interactive" class="solr-ajaxified" href="{s:uri.search.startNewSearch(queryString: searchedFor)}">
                                <a:molecule.itemContent>
                                    <a:molecule.itemLabel truncate="truncate"><f:format.htmlentities>{searchedFor}</f:format.htmlentities></a:molecule.itemLabel>
                                </a:molecule.itemContent>
                            </a:molecule.item>
                        </li>
                    </f:for>
                </a:molecule.list>
            </a:molecule.card>
        </f:if>
    </s:lastSearches>
</f:section>

</html>
