<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:comment>
    Powermail "password" field: two shells, the password and its repetition.
    The second one reuses the shell with `mirror`, which gives it its own id
    and label and leaves the server message to the first.
</f:comment>
<f:render partial="Form/FieldShell" arguments="{field: field, settings: settings, mail: mail, control: 'Password'}" />
<f:render partial="Form/FieldShell" arguments="{field: field, settings: settings, mail: mail, control: 'Password', mirror: 1}" />
</html>
