<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>
<f:comment>
    Setting a new password from the recovery link: a Card with both password
    fields and, when the site has password rules, those rules as the first
    field's help text — so they are read with the field, not only shown
    somewhere below the form.
</f:comment>
<div class="g-plugin" data-g-plugin="login">
    <f:render partial="Messages" />
    <f:render partial="ValidationErrors" />

    <a:molecule.card class="g-plugin__card">
        <f:form action="changePassword" method="post" spellcheck="false" class="g-form" aria="{labelledby: 'tx-felogin-title'}">
            <header class="g-form__header">
                <a:molecule.cardTitle level="3" id="tx-felogin-title"><f:translate domain="felogin.messages" key="change_password_header"/></a:molecule.cardTitle>
                <f:if condition="{passwordRequirements}">
                    <a:atom.text color="secondary"><f:translate domain="felogin.messages" key="change_password_description" /></a:atom.text>
                </f:if>
            </header>
            <fieldset class="g-form__fieldset">
                <a:atom.visuallyHidden as="legend"><f:translate domain="felogin.messages" key="change_password"/></a:atom.visuallyHidden>
                <a:layout.formLayout>
                    <a:molecule.field>
                        <label class="astryx-field-label" for="tx-felogin-input-newpassword-1"><f:translate domain="felogin.messages" key="newpassword_label1"/></label>
                        <f:if condition="{passwordRequirements}">
                            <f:then><f:form.password name="newPass" required="required" autocomplete="new-password" id="tx-felogin-input-newpassword-1" aria="{describedby: 'tx-felogin-password-rules'}"/></f:then>
                            <f:else><f:form.password name="newPass" required="required" autocomplete="new-password" id="tx-felogin-input-newpassword-1"/></f:else>
                        </f:if>
                        <f:if condition="{passwordRequirements}">
                            <div class="astryx-field-description" id="tx-felogin-password-rules">
                                <p><f:translate domain="felogin.messages" key="password_requirement"/></p>
                                <a:molecule.list density="compact" marker="dot">
                                    <f:for each="{passwordRequirements}" as="passwordRequirement">
                                        <a:molecule.listItem>{passwordRequirement}</a:molecule.listItem>
                                    </f:for>
                                </a:molecule.list>
                            </div>
                        </f:if>
                    </a:molecule.field>
                    <a:molecule.field>
                        <label class="astryx-field-label" for="tx-felogin-input-newpassword-2"><f:translate domain="felogin.messages" key="newpassword_label2"/></label>
                        <f:form.password name="newPassRepeat" required="required" autocomplete="new-password" id="tx-felogin-input-newpassword-2"/>
                    </a:molecule.field>
                    <f:form.hidden name="hash" value="{hash}"/>
                    <div class="g-form__actions">
                        <a:atom.button type="submit" class="g-form__submit"><f:translate domain="felogin.messages" key="change_password"/></a:atom.button>
                    </div>
                </a:layout.formLayout>
            </fieldset>
        </f:form>
        <p class="g-form__links">
            <a:atom.link href="{f:uri.action(action: 'login', controller: 'Login')}"><f:translate domain="felogin.messages" key="forgot_header_backToLogin"/></a:atom.link>
        </p>
    </a:molecule.card>
</div>
</html>
