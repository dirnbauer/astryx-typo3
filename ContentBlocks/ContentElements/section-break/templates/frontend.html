<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-section-break" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    The rule is a div and not an hr: the heading under it already announces the
    break, and an hr would report a second, wordless one to anyone listening
    rather than looking.
</f:comment>

<a:layout.section surface="{data.tone}" spacing="{f:if(condition: data.compact, then: 'tight', else: 'default')}" class="g-section-break">
    <a:layout.container>
        <div class="g-section-break__inner" data-align="{data.align}">

            <a:atom.divider class="g-section-break__rule"></a:atom.divider>

            <f:if condition="{data.eyebrow}">
                <a:atom.eyebrow>{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
            </f:if>

            <a:atom.heading level="2">{data -> f:render.text(field: 'header')}</a:atom.heading>

            <f:if condition="{data.subheader}">
                <a:atom.text type="supporting" class="g-section-break__sub">{data -> f:render.text(field: 'subheader')}</a:atom.text>
            </f:if>

        </div>
    </a:layout.container>
</a:layout.section>

</html>
