<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-quote" href="{cb:assetPath()}/frontend.css"/>

<a:layout.section surface="{data.tone}" class="g-hero-quote">
    <a:layout.container size="{data.width}">
        <div class="g-hero-quote__copy" data-align="{data.align}">
            <f:if condition="{data.eyebrow}">
                <a:atom.eyebrow>{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
            </f:if>

            <f:if condition="{data.header}">
                <a:atom.heading level="3" class="g-hero-quote__header">{data -> f:render.text(field: 'header')}</a:atom.heading>
            </f:if>

            <figure class="g-hero-quote__figure">
                <f:comment>
                    quote_text is stored without quotation marks so the same
                    sentence can be reused where a different pair — or none —
                    is wanted; the marks here are drawn, not typed.
                </f:comment>
                <a:molecule.blockquote class="g-hero-quote__quote">
                    <p class="g-hero-quote__text">{data -> f:render.text(field: 'quote_text')}</p>
                </a:molecule.blockquote>

                <f:if condition="{data.author} || {data.image}">
                    <figcaption class="g-hero-quote__attribution">
                        <f:if condition="{data.image}">
                            <a:atom.avatar class="g-hero-quote__portrait">
                                <f:for each="{data.image}" as="image">
                                    <f:image image="{image}" alt="{image.alternative}" title="{image.title}" width="128" height="128" loading="eager"/>
                                </f:for>
                            </a:atom.avatar>
                        </f:if>
                        <span class="g-hero-quote__attribution-text">
                            <f:if condition="{data.author}">
                                <span class="g-hero-quote__author">{data -> f:render.text(field: 'author')}</span>
                            </f:if>
                            <f:if condition="{data.role}">
                                <a:atom.text type="supporting" as="span" class="g-hero-quote__role">{data -> f:render.text(field: 'role')}</a:atom.text>
                            </f:if>
                        </span>
                    </figcaption>
                </f:if>
            </figure>

            <f:if condition="{data.cta_label}">
                <a:molecule.buttonGroup class="g-hero-quote__actions">
                    <a:atom.button variant="primary" size="lg" parameter="{data.cta_link}">{data.cta_label}</a:atom.button>
                </a:molecule.buttonGroup>
            </f:if>
        </div>
    </a:layout.container>
</a:layout.section>

</html>
