<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-customer-story-quote" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    The image slot holds the customer's mark, not a portrait, so it needs a real
    alt naming the organisation — the file's own alternative text first, and the
    role line, which carries the company, as the fallback.
</f:comment>

<a:layout.section surface="{data.tone}" class="g-customer-story-quote">
    <a:layout.container size="{data.width}">
        <figure class="g-customer-story-quote__figure">

            <f:if condition="{data.eyebrow}">
                <a:atom.eyebrow>{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
            </f:if>

            <f:if condition="{data.image}">
                <f:for each="{data.image}" as="image">
                    <f:image image="{image}"
                             alt="{f:if(condition: image.alternative, then: image.alternative, else: data.role)}"
                             height="96"
                             loading="lazy"
                             class="g-customer-story-quote__mark"/>
                </f:for>
            </f:if>

            <a:molecule.blockquote class="g-customer-story-quote__quote">
                <p>{data -> f:render.text(field: 'quote_text')}</p>
            </a:molecule.blockquote>

            <f:if condition="{data.author}">
                <a:molecule.citation class="g-customer-story-quote__credit">
                    <span class="g-customer-story-quote__name">{data -> f:render.text(field: 'author')}</span>
                    <f:if condition="{data.role}">
                        <span class="g-customer-story-quote__role">{data -> f:render.text(field: 'role')}</span>
                    </f:if>
                </a:molecule.citation>
            </f:if>

        </figure>

        <f:if condition="{data.cta_label}">
            <p class="g-customer-story-quote__actions">
                <a:atom.link variant="cta" parameter="{data.cta_link}">{data.cta_label}</a:atom.link>
            </p>
        </f:if>
    </a:layout.container>
</a:layout.section>

</html>
