<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-metrics" href="{cb:assetPath()}/frontend.css"/>

<a:layout.section surface="{data.tone}" class="g-hero-metrics">
    <a:layout.container size="{data.width}">
        <div class="g-hero-metrics__copy {data.align}">
            <f:if condition="{data.eyebrow}">
                <a:atom.eyebrow>{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
            </f:if>

            <a:atom.heading level="1">{data -> f:render.text(field: 'header')}</a:atom.heading>

            <f:if condition="{data.lead}">
                <a:atom.text type="large" class="g-hero-metrics__lead">{data -> f:render.text(field: 'lead')}</a:atom.text>
            </f:if>

            <f:if condition="{data.cta_label} || {data.secondary_label}">
                <a:molecule.buttonGroup class="g-hero-metrics__actions">
                    <f:if condition="{data.cta_label}">
                        <a:atom.button variant="primary" size="lg" parameter="{data.cta_link}">{data.cta_label}</a:atom.button>
                    </f:if>
                    <f:if condition="{data.secondary_label}">
                        <a:atom.button variant="ghost" size="lg" parameter="{data.secondary_link}">{data.secondary_label}</a:atom.button>
                    </f:if>
                </a:molecule.buttonGroup>
            </f:if>
        </div>

        <f:if condition="{data.metrics}">
            <a:atom.divider class="g-hero-metrics__rule" />

            <a:layout.grid cols="4" class="g-hero-metrics__figures">
                <f:for each="{data.metrics}" as="metric">
                    <div class="g-hero-metrics__figure">
                        <a:atom.text type="label" as="dt" class="g-hero-metrics__label">{metric -> f:render.text(field: 'title')}</a:atom.text>
                        <dd class="g-hero-metrics__value">
                            <span class="g-hero-metrics__number">{metric -> f:render.text(field: 'value')}</span><f:if condition="{metric.unit}"><span class="g-hero-metrics__unit">{metric.unit}</span></f:if>
                        </dd>
                        <f:if condition="{metric.text}">
                            <a:atom.text type="supporting" as="dd" class="g-hero-metrics__note">{metric -> f:render.text(field: 'text')}</a:atom.text>
                        </f:if>
                    </div>
                </f:for>
            </a:layout.grid>
        </f:if>
    </a:layout.container>
</a:layout.section>

</html>
