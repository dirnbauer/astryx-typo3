<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-pull-quote" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    The quotation marks are drawn by the stylesheet, so the stored text has none
    of its own — otherwise an editor who types them gets two sets, and a search
    index gets a phrase that no longer matches the article it was lifted from.
</f:comment>

<a:layout.section class="g-pull-quote">
    <a:layout.container size="{data.width}">
        <figure class="g-pull-quote__figure align-{data.align}">

            <a:molecule.blockquote class="g-pull-quote__quote">
                <p>{data -> f:render.text(field: 'quote_text')}</p>
            </a:molecule.blockquote>

            <f:if condition="{data.author}">
                <a:molecule.citation class="g-pull-quote__credit">
                    {data -> f:render.text(field: 'author')}<f:if condition="{data.role}"><span class="g-pull-quote__role">{data -> f:render.text(field: 'role')}</span></f:if>
                </a:molecule.citation>
            </f:if>

        </figure>
    </a:layout.container>
</a:layout.section>

</html>
