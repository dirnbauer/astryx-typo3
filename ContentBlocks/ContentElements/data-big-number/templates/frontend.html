<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-data-big-number" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    A figure with a caption is exactly what a figure element is for: the
    headline is not a section title here, it is the sentence the number
    completes, so it belongs inside the caption rather than above it.
</f:comment>

<a:layout.section surface="{data.tone}" spacing="{f:if(condition: data.compact, then: 'tight', else: 'default')}" class="g-data-big-number">
    <a:layout.container size="{data.width}">

        <figure class="g-data-big-number__block" data-align="{data.align}">
            <f:if condition="{data.eyebrow}">
                <a:atom.eyebrow>{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
            </f:if>

            <p class="g-data-big-number__figure">
                <a:atom.text type="display-1" as="span" class="g-data-big-number__value">{data -> f:render.text(field: 'value')}</a:atom.text><f:if condition="{data.unit}"><span class="g-data-big-number__unit">{data -> f:render.text(field: 'unit')}</span></f:if>
            </p>

            <figcaption class="g-data-big-number__caption">
                <a:atom.heading level="2">{data -> f:render.text(field: 'header')}</a:atom.heading>

                <f:if condition="{data.lead}">
                    <a:atom.text type="large" class="g-data-big-number__lead">{data -> f:render.text(field: 'lead')}</a:atom.text>
                </f:if>
            </figcaption>
        </figure>

        <div class="g-data-big-number__after" data-align="{data.align}">
            <f:if condition="{data.note}">
                <a:atom.text type="supporting" class="g-data-big-number__note">{data -> f:render.text(field: 'note')}</a:atom.text>
            </f:if>

            <f:if condition="{data.cta_label}">
                <p class="g-data-big-number__actions">
                    <a:atom.button variant="primary" size="lg" parameter="{data.cta_link}">{data.cta_label}</a:atom.button>
                </p>
            </f:if>
        </div>

    </a:layout.container>
</a:layout.section>

</html>
