<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-hero-category" href="{cb:assetPath()}/frontend.css"/>

<a:layout.section surface="{data.tone}" spacing="{f:if(condition: data.compact, then: 'tight', else: 'default')}" class="g-hero-category">
    <a:layout.container size="{data.width}">
        <div class="g-hero-category__band" data-variant="{f:if(condition: data.image, then: 'has-media')}">

            <div class="g-hero-category__copy" data-align="{data.align}">
                <p class="g-hero-category__flags">
                    <f:if condition="{data.eyebrow}">
                        <a:atom.eyebrow as="span">{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
                    </f:if>
                    <f:if condition="{data.badge_text}">
                        <a:atom.badge variant="neutral" as="span" class="g-hero-category__count">{data.badge_text}</a:atom.badge>
                    </f:if>
                </p>

                <a:atom.heading level="2">{data -> f:render.text(field: 'header')}</a:atom.heading>

                <f:if condition="{data.lead}">
                    <a:atom.text type="body" class="g-hero-category__lead">{data -> f:render.text(field: 'lead')}</a:atom.text>
                </f:if>
            </div>

            <f:if condition="{data.image}">
                <div class="g-hero-category__media">
                    <f:for each="{data.image}" as="image">
                        <f:image image="{image}" alt="{image.alternative}" title="{image.title}" width="320" height="320" loading="eager" class="g-hero-category__image"/>
                    </f:for>
                </div>
            </f:if>

        </div>
    </a:layout.container>
</a:layout.section>

</html>
