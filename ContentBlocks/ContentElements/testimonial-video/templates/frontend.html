<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-testimonial-video" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    No player is embedded. The poster is a still with one button laid over it
    that links to the recording, which keeps the band free of third-party
    scripts and consent prompts until the reader has decided to watch.

    The button is the link, and the only one: an <a> around the whole poster
    with a <button> inside it, which is what this element used to render, is
    interactive content inside interactive content and not valid HTML. Overlay
    lays the button over the still and takes the frame's corners; the button
    renders only when it has a target, so a poster without a link is a picture
    rather than a dead control.
</f:comment>

<a:layout.section surface="{data.tone}" class="g-testimonial-video">
    <a:layout.container size="{data.width}">
        <a:layout.stack gap="8">

            <a:molecule.sectionIntro>
                <f:fragment name="eyebrow">{data -> f:render.text(field: 'eyebrow')}</f:fragment>
                <f:fragment name="heading">{data -> f:render.text(field: 'header')}</f:fragment>
            </a:molecule.sectionIntro>

            <a:layout.split>

                <f:if condition="{data.image}">
                    <a:molecule.overlay align="center">
                        <f:fragment>
                            <a:atom.aspectRatio>
                                <f:for each="{data.image}" as="image">
                                    <f:image image="{image}" alt="{image.alternative}" width="960" loading="lazy"/>
                                </f:for>
                            </a:atom.aspectRatio>
                        </f:fragment>

                        <f:fragment name="scrim"><f:if condition="{data.cta_label} && {data.cta_link.url}"><a:atom.button variant="primary" size="lg" parameter="{data.cta_link}"><a:atom.icon name="play" size="sm" />{data.cta_label}</a:atom.button></f:if></f:fragment>
                    </a:molecule.overlay>
                </f:if>

                <a:molecule.figure class="g-testimonial-video__figure">
                    <a:molecule.blockquote size="lg" marks="auto">
                        <p>{data -> f:render.text(field: 'quote_text')}</p>
                    </a:molecule.blockquote>

                    <f:if condition="{data.author}">
                        <a:molecule.citation class="g-testimonial-video__credit">
                            <a:atom.text type="label" as="span">{data -> f:render.text(field: 'author')}</a:atom.text>
                            <f:if condition="{data.role}">
                                <a:atom.text type="supporting" as="span">{data -> f:render.text(field: 'role')}</a:atom.text>
                            </f:if>
                        </a:molecule.citation>
                    </f:if>
                </a:molecule.figure>

            </a:layout.split>

        </a:layout.stack>
    </a:layout.container>
</a:layout.section>

</html>
