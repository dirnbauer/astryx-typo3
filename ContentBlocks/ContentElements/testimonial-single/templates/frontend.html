<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-testimonial-single" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    The quotation marks are drawn by the stylesheet with quotes: auto, so a
    German page gets its own pair and an English one another. That is why the
    field is stored bare — an editor who types the marks in gets four.
</f:comment>

<a:layout.section surface="{data.tone}" class="g-testimonial-single" data-align="{data.align}">
    <a:layout.container size="{data.width}">

        <f:if condition="{data.eyebrow}">
            <a:atom.eyebrow class="g-testimonial-single__eyebrow">{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
        </f:if>

        <figure class="g-testimonial-single__figure">
            <a:molecule.blockquote class="g-testimonial-single__quote">
                <p>{data -> f:render.text(field: 'quote_text')}</p>
            </a:molecule.blockquote>

            <f:if condition="{data.author}">
                <a:molecule.citation class="g-testimonial-single__credit">
                    <span class="g-testimonial-single__name">{data -> f:render.text(field: 'author')}</span>
                    <f:if condition="{data.role}">
                        <span class="g-testimonial-single__role">{data -> f:render.text(field: 'role')}</span>
                    </f:if>
                </a:molecule.citation>
            </f:if>
        </figure>

    </a:layout.container>
</a:layout.section>

</html>
