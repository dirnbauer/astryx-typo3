<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-endorsement-single" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    An endorsement leans on who is speaking, so the credentials are set at the
    same weight as the name rather than being demoted to a caption whisper.
    The portrait carries an empty alt: the name is printed right beside it.
</f:comment>

<a:layout.section surface="{data.tone}" class="g-endorsement-single" data-align="{data.align}">
    <a:layout.container size="{data.width}">
        <figure class="g-endorsement-single__figure">

            <f:if condition="{data.eyebrow}">
                <a:atom.eyebrow>{data -> f:render.text(field: 'eyebrow')}</a:atom.eyebrow>
            </f:if>

            <f:if condition="{data.badge_text}">
                <p class="g-endorsement-single__badge-row">
                    <a:atom.badge variant="outline" as="span">{data -> f:render.text(field: 'badge_text')}</a:atom.badge>
                </p>
            </f:if>

            <a:molecule.blockquote class="g-endorsement-single__quote">
                <p>{data -> f:render.text(field: 'quote_text')}</p>
            </a:molecule.blockquote>

            <a:molecule.citation class="g-endorsement-single__credit">
                <f:if condition="{data.image}">
                    <a:atom.avatar size="lg" class="g-endorsement-single__portrait">
                        <f:for each="{data.image}" as="image">
                            <f:image image="{image}" alt="" width="96c" height="96c" loading="lazy"/>
                        </f:for>
                    </a:atom.avatar>
                </f:if>

                <span class="g-endorsement-single__who">
                    <span class="g-endorsement-single__name">{data -> f:render.text(field: 'author')}</span>
                    <f:if condition="{data.role}">
                        <span class="g-endorsement-single__role">{data -> f:render.text(field: 'role')}</span>
                    </f:if>
                </span>
            </a:molecule.citation>

        </figure>
    </a:layout.container>
</a:layout.section>

</html>
