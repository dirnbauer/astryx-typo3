<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:a="http://typo3.org/ns/Webconsulting/AstryxTypo3/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="g-lead-paragraph" href="{cb:assetPath()}/frontend.css"/>

<f:comment>
    The lead is a plain paragraph, not a heading at a smaller weight: it is the
    first sentence of the piece, and a screen reader that hears it announced as
    a heading loses the boundary between the title and the text.
</f:comment>

<a:layout.section surface="{data.tone}" class="g-lead-paragraph">
    <a:layout.container size="{data.width}">
        <div class="g-lead-paragraph__body" data-align="{data.align}">

            <f:if condition="{data.header}">
                <a:atom.heading level="2">{data -> f:render.text(field: 'header')}</a:atom.heading>
            </f:if>

            <a:atom.text type="large" class="g-lead-paragraph__lead">{data -> f:render.text(field: 'lead')}</a:atom.text>

        </div>
    </a:layout.container>
</a:layout.section>

</html>
