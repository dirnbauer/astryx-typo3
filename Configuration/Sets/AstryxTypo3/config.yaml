name: webconsulting/astryx-typo3
label: "Astryx for TYPO3 Base (Astryx)"
hidden: true
# Desiderio is the engine underneath: the PAGE object, the PAGEVIEW data
# processors, the element library endpoint and the seeding services all come
# from it. This set replaces the visible layer — assets, page templates, theme
# attributes — and leaves that machinery alone.
dependencies:
  - webconsulting/desiderio
optionalDependencies:
  - typo3/seo-sitemap
  # Powermail's own TypoScript and settings; the Astryx Powermail templates
  # (TypoScript/plugins.typoscript) need a configured plugin to render into.
  - in2code/powermail-main
