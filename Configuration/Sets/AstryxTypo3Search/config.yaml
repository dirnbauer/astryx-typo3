name: webconsulting/astryx-typo3-search
label: "Astryx for TYPO3 Search (Astryx)"
hidden: true
# webconsulting/solr-defaults is the whole EXT:solr stack Desiderio already
# assembles: the base TypoScript, the index queue, the suggest page type
# (tx_solr_suggest, typeNum 7384) and the faceting defaults. This set adds one
# thing to it — the Astryx skin — rather than restating any of that.
dependencies:
  - webconsulting/astryx-typo3
  - webconsulting/solr-defaults
